<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pasapalabra · Página no encontrada</title>
  <!-- GitHub Pages sirve este archivo para cualquier ruta que no existe, a cualquier profundidad:
       por eso los estilos van inline y los links se arman con la raíz del sitio. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 24px;
      font-family: "Trebuchet MS", system-ui, sans-serif; color: #f4f7ff; text-align: center;
      background: radial-gradient(120% 90% at 50% 0%, #0d2f9c 0%, #071a52 62%); }
    h1 { margin: 0; color: #ffd23f; letter-spacing: .08em; }
    p { margin: 0; color: #a9b8e6; font-size: 1.15rem; }
    .botones { display: grid; gap: 14px; width: min(420px, 100%); }
    a { display: block; padding: 18px; border-radius: 14px; background: #1f4fe0; color: #fff; font-size: 1.3rem;
      font-weight: 800; text-decoration: none; }
    a.tv { background: #17a34a; }
  </style>
</head>
<body>
  <h1>PASAPALABRA</h1>
  <p id="msg">Esa página no existe. ¿Qué querés abrir?</p>
  <div class="botones">
    <a id="control" href="/">📱 Control (celular)</a>
    <a id="tv" class="tv" href="/tv.html">📺 Pantalla de TV</a>
  </div>
  <script>
    // Raíz del sitio de proyecto: /<repo>/
    const raiz = '/' + (location.pathname.split('/')[1] || '') + '/';
    document.getElementById('control').href = raiz;
    document.getElementById('tv').href = raiz + 'tv.html' + location.search;
    import(raiz + 'js/ruta404.js')
      .then(({ destino }) => {
        const a = destino(location.pathname, location.search, location.hash);
        if (a) {
          document.getElementById('msg').textContent = 'Te llevamos a la página correcta…';
          location.replace(a);
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
